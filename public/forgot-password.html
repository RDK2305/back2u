<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Reset your CampusFind password securely" />
    <meta name="color-scheme" content="light" />
    <title>Forgot Password — CampusFind</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/stylesheets/style.min.css" />
    <style>
      *{font-family:'Inter',sans-serif;box-sizing:border-box;}
      body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0F172A 0%,#1E1B4B 55%,#0F172A 100%);padding:24px;}
      .step-badge{transition:background .3s,color .3s;}
      .step-line{flex:1;height:2px;background:#E0E7FF;margin-top:20px;transition:background .3s;}
      .step-line.done{background:#4F46E5;}
      input:focus{box-shadow:0 0 0 3px rgba(79,70,229,.15);}
      @keyframes fadeIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:translateY(0);}}
      .msg-animate{animation:fadeIn .2s ease;}
      .cf-card{background:#fff;border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,.3);padding:40px 36px;max-width:500px;width:100%;border:1px solid rgba(255,255,255,.1);}
      .cf-section-title{font-size:26px;font-weight:800;color:#0F172A;letter-spacing:-1px;margin:0;}
      .cf-section-desc{color:#64748B;font-size:14px;margin:8px 0 28px;line-height:1.6;}
      .cf-label{display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:7px;}
      .cf-input{width:100%;padding:12px 16px;border:1.5px solid #E2E8F0;border-radius:11px;font-size:15px;font-family:'Inter',sans-serif;color:#1E293B;background:#fff;transition:all .2s;outline:none;margin-bottom:16px;}
      .cf-input:focus{border-color:#4F46E5;box-shadow:0 0 0 3px rgba(79,70,229,.1);}
      .cf-btn{width:100%;padding:14px;background:linear-gradient(135deg,#4F46E5,#7C3AED);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;font-family:'Inter',sans-serif;cursor:pointer;transition:all .25s;box-shadow:0 4px 14px rgba(79,70,229,.35);margin-top:8px;margin-bottom:8px;}
      .cf-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(79,70,229,.45);}
      .cf-btn-secondary{width:100%;padding:14px;background:#F1F5F9;color:#4F46E5;border:none;border-radius:12px;font-size:15px;font-weight:700;font-family:'Inter',sans-serif;cursor:pointer;transition:all .25s;margin-top:8px;}
      .cf-btn-secondary:hover{background:#E0E7FF;transform:translateY(-2px);}
      .cf-success{background:#F0FDF4;border-left:4px solid #22C55E;color:#166534;padding:12px 16px;border-radius:10px;font-size:14px;margin-bottom:16px;display:none;}
      .cf-error{background:#FEF2F2;border-left:4px solid #EF4444;color:#B91C1C;padding:12px 16px;border-radius:10px;font-size:14px;margin-bottom:16px;display:none;}
      .step-indicator{display:flex;align-items:center;margin-bottom:32px;}
      .step-badge{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;}
      .step-label{font-size:12px;font-weight:600;margin-top:8px;text-align:center;min-height:16px;}
      .step-wrapper{display:flex;flex-direction:column;align-items:center;}
    </style>
  </head>
  <body>
    <div class="cf-card">
      <!-- Logo / Brand -->
      <div style="text-align:center;margin-bottom:32px;">
        <div style="width:56px;height:56px;background:linear-gradient(135deg,#4F46E5,#7C3AED);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 16px;box-shadow:0 4px 14px rgba(79,70,229,.35);">🔐</div>
        <h1 class="cf-section-title">Reset Password</h1>
        <p class="cf-section-desc">We'll help you regain access to your account</p>
      </div>

      <!-- Messages -->
      <div id="successMsg" class="cf-success"></div>
      <div id="errorMsg" class="cf-error"></div>

      <!-- Step Indicator -->
      <div class="step-indicator">
        <div class="step-wrapper">
          <div class="step-badge" data-step="1" style="background:#4F46E5;color:#fff;">1</div>
          <div class="step-label" id="label1" style="color:#4F46E5;">Email</div>
        </div>
        <div class="step-line" id="line1"></div>
        <div class="step-wrapper">
          <div class="step-badge" data-step="2" style="background:#E0E7FF;color:#9CA3AF;">2</div>
          <div class="step-label" id="label2" style="color:#9CA3AF;">Code</div>
        </div>
        <div class="step-line" id="line2"></div>
        <div class="step-wrapper">
          <div class="step-badge" data-step="3" style="background:#E0E7FF;color:#9CA3AF;">3</div>
          <div class="step-label" id="label3" style="color:#9CA3AF;">Password</div>
        </div>
      </div>

      <!-- Step 1: Email -->
      <div id="step1" class="step-content">
        <form onsubmit="sendOTP(event)">
          <label for="emailInput" class="cf-label">Email Address</label>
          <input type="email" id="emailInput" name="email" placeholder="you@conestogac.on.ca" autocomplete="email" class="cf-input" required />
          <button type="submit" class="cf-btn">📧 Send Code</button>
          <a href="login.html" class="cf-btn-secondary" style="text-align:center;display:flex;align-items:center;justify-content:center;">← Back to Login</a>
        </form>
      </div>

      <!-- Step 2: OTP -->
      <div id="step2" class="step-content hidden">
        <form onsubmit="verifyOTP(event)">
          <p style="color:#64748B;font-size:14px;margin:0 0 4px;">Code sent to</p>
          <p id="emailDisplay" style="font-weight:700;color:#0F172A;font-size:14px;margin:0 0 16px;"></p>
          <label for="otpInput" class="cf-label">Enter 6-Digit Code</label>
          <input type="text" id="otpInput" placeholder="· · · · · ·" maxlength="6" inputmode="numeric" class="cf-input" style="text-align:center;font-size:24px;letter-spacing:4px;" required />
          <p style="color:#9CA3AF;font-size:12px;margin:0 0 16px;text-align:center;">⏰ Expires in 10 minutes</p>
          <button type="submit" class="cf-btn">Verify Code →</button>
          <button type="button" onclick="goBack(2)" class="cf-btn-secondary">← Back</button>
          <button type="button" onclick="resendOTP()" style="width:100%;background:none;border:none;color:#4F46E5;font-size:14px;font-weight:600;cursor:pointer;margin-top:8px;text-decoration:underline;">🔄 Resend Code</button>
        </form>
      </div>

      <!-- Step 3: New Password -->
      <div id="step3" class="step-content hidden">
        <form onsubmit="resetPassword(event)">
          <input type="hidden" id="emailFieldForPwMgr" name="username" autocomplete="username" />
          <label for="passwordInput" class="cf-label">New Password</label>
          <input type="password" id="passwordInput" name="password" placeholder="Strong password (8+ chars)" autocomplete="new-password" class="cf-input" spellcheck="false" required />
          <small style="color:#64748B;font-size:12px;display:block;margin-bottom:16px;">Need: 8+ chars • number • special char (!@#$%^&*)</small>
          <label for="confirmInput" class="cf-label">Confirm Password</label>
          <input type="password" id="confirmInput" name="confirm-password" placeholder="Re-enter password" autocomplete="new-password" class="cf-input" spellcheck="false" required />
          <button type="submit" class="cf-btn" style="background:linear-gradient(135deg,#22C55E,#16A34A);">🔒 Reset Password</button>
          <button type="button" onclick="goBack(3)" class="cf-btn-secondary">← Back</button>
        </form>
      </div>

      <!-- Success -->
      <div id="stepSuccess" class="step-content hidden" style="text-align:center;padding:24px 0;">
        <div style="width:80px;height:80px;background:#F0FDF4;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px;margin:0 auto 24px;">✅</div>
        <h2 style="font-size:20px;font-weight:700;color:#0F172A;margin:0 0 12px;">Password Reset!</h2>
        <p style="color:#64748B;font-size:14px;margin:0 0 24px;">Your password has been updated successfully.</p>
        <a href="login.html" class="cf-btn">Sign In Now →</a>
      </div>
    </div>

    <script>
      let userEmail = "";
      let userOtp = "";

      /* ── Messages ─────────────────────────────────────── */
      function showError(msg, hint = false) {
        const box = document.getElementById("errorMsg");
        document.getElementById("errorText").textContent = msg;
        document
          .getElementById("registerHint")
          .classList.toggle("hidden", !hint);
        box.classList.remove("hidden");
        box.classList.add("msg-animate");
        document.getElementById("successMsg").classList.add("hidden");
      }
      function showSuccess(msg) {
        const box = document.getElementById("successMsg");
        document.getElementById("successText").textContent = msg;
        box.classList.remove("hidden");
        box.classList.add("msg-animate");
        document.getElementById("errorMsg").classList.add("hidden");
      }
      function hideMessages() {
        document.getElementById("errorMsg").classList.add("hidden");
        document.getElementById("successMsg").classList.add("hidden");
        document.getElementById("registerHint").classList.add("hidden");
      }

      /* ── Step Navigation ───────────────────────────────── */
      function showStep(step) {
        if (step === "Success") {
          document
            .querySelectorAll(".step-content")
            .forEach((el) => el.classList.add("hidden"));
          document.getElementById("stepSuccess").classList.remove("hidden");
          // All badges green
          document.querySelectorAll(".step-badge").forEach((b) => {
            b.className = b.className.replace(/bg-\S+|text-\S+/g, "");
            b.classList.add("bg-green-600", "text-white");
            b.textContent = "✓";
          });
          document.getElementById("line1").classList.add("done");
          document.getElementById("line2").classList.add("done");
          return;
        }

        document
          .querySelectorAll(".step-content")
          .forEach((el) => el.classList.add("hidden"));
        document.getElementById("step" + step).classList.remove("hidden");

        // Update badges & labels
        const labels = { 1: "Email", 2: "OTP", 3: "New Password" };
        document.querySelectorAll(".step-badge").forEach((badge) => {
          const s = parseInt(badge.dataset.step);
          badge.className = badge.className.replace(/bg-\S+|text-\S+/g, "");
          if (s < step) {
            badge.classList.add("bg-green-600", "text-white");
            badge.textContent = "✓";
          } else if (s === step) {
            badge.classList.add("bg-blue-600", "text-white");
            badge.textContent = s;
          } else {
            badge.classList.add("bg-gray-200", "text-gray-400");
            badge.textContent = s;
          }
          // Update label colour
          const lbl = document.getElementById("label" + s);
          if (lbl)
            lbl.className = `text-xs mt-2 font-semibold ${s <= step ? (s < step ? "text-green-600" : "text-blue-600") : "text-gray-400"}`;
        });

        // Lines
        document.getElementById("line1").classList.toggle("done", step > 1);
        document.getElementById("line2").classList.toggle("done", step > 2);
      }

      function goBack(fromStep) {
        hideMessages();
        if (fromStep === 2) {
          document.getElementById("otpInput").value = "";
          showStep(1);
        } else if (fromStep === 3) {
          document.getElementById("passwordInput").value = "";
          document.getElementById("confirmInput").value = "";
          showStep(2);
        }
      }

      /* ── Step 1: Send OTP ──────────────────────────────── */
      async function sendOTP(e) {
        e.preventDefault();
        hideMessages();
        userEmail = document.getElementById("emailInput").value.trim();
        if (!userEmail) {
          showError("Please enter your email");
          return;
        }

        const btn = e.target.querySelector('button[type="submit"]');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> Sending...';

        try {
          const res = await fetch("/api/auth/forgot-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: userEmail }),
          });
          const data = await res.json();

          if (res.ok) {
            showSuccess("Code sent to " + userEmail);
            document.getElementById("emailDisplay").textContent = userEmail;
            setTimeout(() => {
              hideMessages();
              showStep(2);
            }, 1500);
          } else if (res.status === 404 && data.notRegistered) {
            showError(data.message, true);
          } else {
            showError(data.message || "Failed to send code. Try again.");
          }
        } catch {
          showError("Network error. Check your connection.");
        } finally {
          btn.disabled = false;
          btn.innerHTML = "📧 Send OTP";
        }
      }

      /* ── Step 2: Verify OTP ────────────────────────────── */
      async function verifyOTP(e) {
        e.preventDefault();
        hideMessages();
        userOtp = document.getElementById("otpInput").value.trim();
        if (userOtp.length !== 6) {
          showError("Please enter the 6-digit code");
          return;
        }

        const btn = e.target.querySelector('button[type="submit"]');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> Verifying...';

        try {
          const res = await fetch("/api/auth/verify-otp", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: userEmail, otp: userOtp }),
          });
          const data = await res.json();

          if (res.ok && data.verified) {
            showSuccess("Code verified!");
            setTimeout(() => {
              hideMessages();
              // Populate hidden email field for password manager
              document.getElementById("emailFieldForPwMgr").value = userEmail;
              showStep(3);
            }, 1200);
          } else {
            showError(data.message || "Invalid or expired code");
          }
        } catch {
          showError("Network error. Check your connection.");
        } finally {
          btn.disabled = false;
          btn.innerHTML = "Verify Code →";
        }
      }

      /* ── Step 3: Reset Password ────────────────────────── */
      async function resetPassword(e) {
        e.preventDefault();
        hideMessages();
        const pwd = document.getElementById("passwordInput").value;
        const confirm = document.getElementById("confirmInput").value;

        if (pwd !== confirm) {
          showError("Passwords do not match");
          return;
        }
        if (pwd.length < 8) {
          showError("Password must be at least 8 characters");
          return;
        }
        if (!/\d/.test(pwd)) {
          showError("Password must include at least one number");
          return;
        }
        if (!/[!@#$%^&*]/.test(pwd)) {
          showError("Password must include a special character (!@#$%^&*)");
          return;
        }

        const btn = e.target.querySelector('button[type="submit"]');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> Resetting...';

        try {
          const res = await fetch("/api/auth/reset-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              email: userEmail,
              otp: userOtp,
              newPassword: pwd,
            }),
          });
          const data = await res.json();

          if (res.ok) {
            showStep("Success");
          } else {
            showError(data.message || "Failed to reset password");
          }
        } catch {
          showError("Network error. Check your connection.");
        } finally {
          btn.disabled = false;
          btn.innerHTML = "🔒 Reset Password";
        }
      }

      /* ── Resend OTP ────────────────────────────────────── */
      async function resendOTP() {
        hideMessages();
        try {
          const res = await fetch("/api/auth/forgot-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: userEmail }),
          });
          const data = await res.json();
          if (res.ok) {
            showSuccess("New code sent to " + userEmail);
            document.getElementById("otpInput").value = "";
          } else {
            showError(data.message || "Failed to resend code");
          }
        } catch {
          showError("Network error. Check your connection.");
        }
      }
    </script>
  </body>
</html>
